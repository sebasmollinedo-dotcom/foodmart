# Datos crudos (hoja "Stores-Data" del Excel de FoodMart)
stores_raw:
  type: pandas.ExcelDataset
  filepath: data/01_raw/StoresData.xlsx
  load_args:
    sheet_name: Stores-Data

stores_clean:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/stores_clean.csv

X_train:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_train.csv
X_test:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_test.csv
y_train:
  type: pandas.CSVDataset
  filepath: data/05_model_input/y_train.csv
y_test:
  type: pandas.CSVDataset
  filepath: data/05_model_input/y_test.csv

selected_features:
  type: pickle.PickleDataset
  filepath: data/06_models/selected_features.pkl

models:
  type: pickle.PickleDataset
  filepath: data/06_models/models.pkl

metrics:
  type: pandas.CSVDataset
  filepath: data/08_reporting/metrics.csv
  save_args:
    index: false

feature_importance:
  type: pandas.CSVDataset
  filepath: data/08_reporting/feature_importance.csv
  save_args:
    index: false

feature_selection:
  type: pandas.CSVDataset
  filepath: data/08_reporting/feature_selection.csv
  save_args:
    index: false

cv_metrics:
  type: pandas.CSVDataset
  filepath: data/08_reporting/cv_metrics.csv
  save_args:
    index: false

driver_effects:
  type: pandas.CSVDataset
  filepath: data/08_reporting/driver_effects.csv
  save_args:
    index: false

success_profile:
  type: pandas.CSVDataset
  filepath: data/08_reporting/success_profile.csv
  save_args:
    index: false

success_by_competition:
  type: pandas.CSVDataset
  filepath: data/08_reporting/success_by_competition.csv
  save_args:
    index: false

classification_metrics:
  type: pandas.CSVDataset
  filepath: data/08_reporting/classification_metrics.csv
  save_args:
    index: false

confusion_matrix:
  type: pandas.CSVDataset
  filepath: data/08_reporting/confusion_matrix.csv
  save_args:
    index: false

eda_summary:
  type: json.JSONDataset
  filepath: data/08_reporting/eda_summary.json

# Reporte final (se abre solo en el navegador al terminar `kedro run`)
report_html:
  type: text.TextDataset
  filepath: data/08_reporting/reporte.html
