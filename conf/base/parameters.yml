target: gross_profit

# Columnas que NO se usan para predecir:
# ventas y salarios son resultados del negocio (no decisiones), y el ID no aporta.
drop_columns: [store_no, sales_m, wages_m]

# Variables categóricas codificadas como números (1,2,3...)
categorical: [location, state]

# Outliers: se recortan los features a [Q1 - k*IQR, Q3 + k*IQR]
outlier_iqr_factor: 1.5

# Modelo elegido (ver README): baseline_media | regresion_simple | ridge | random_forest
final_model: regresion_simple

# Variables que usa la regresión simple (el EDA: competidores explica casi toda la utilidad)
simple_features: [competitors]

# Umbral (en $ millones) para clasificar una tienda como de "alta utilidad" (F1, matriz)
profitable_threshold: 1.0

test_size: 0.2
random_state: 42

# Búsqueda de hiperparámetros del Random Forest
rf_param_grid:
  n_estimators: [100, 300]
  max_depth: [3, 5, null]
  min_samples_leaf: [2, 5]
cv_folds: 5
